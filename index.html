  function b64(s){
    const bin = atob(s);
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  async function unlock(password){
    const enc = new TextEncoder();
    const material = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
      material,
      {name:"AES-GCM", length:256},
      false,
      ["decrypt"]
    );
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.data));
    const html = new TextDecoder().decode(plain);
    const doc = document.open("text/html");
    doc.write(html);
    doc.close();
  }
  const f = document.getElementById("f");
  const p = document.getElementById("p");
  const b = document.getElementById("b");
  const e = document.getElementById("e");
  f.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const val = p.value;
    if (!val){ p.focus(); return; }
    b.disabled = true;
    e.hidden = true;
    try { await unlock(val); }
    catch (err) {
      e.hidden = false;
      p.value = "";
      p.focus();
      b.disabled = false;
    }
  });
  </script>
